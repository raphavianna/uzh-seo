<title>Painel de Conteúdos — Use Zero Hora</title>
<style>
:root{
  --ground:#EEF2F3; --surface:#FFFFFF; --surface-2:#F6F9F9; --surface-3:#E8EEEF;
  --ink:#0E2028; --ink-2:#4E6670; --ink-3:#7C929B;
  --line:#D6E0E3; --line-2:#C2D0D4;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DFEFF0;
  --danger:#A32A2A; --danger-soft:#FBE9E9;
  --warn:#9A6510; --ok:#1D6E48;
  --raia-1:#6F8189; --raia-2:#B5761A; --raia-3:#7A5EA6; --raia-4:#1D6E48; --raia-5:#0B6E78;
  --shadow:0 1px 2px rgba(14,32,40,.06), 0 8px 24px rgba(14,32,40,.06);
  --shadow-lg:0 2px 8px rgba(14,32,40,.10), 0 24px 64px rgba(14,32,40,.18);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0A1317; --surface:#101E24; --surface-2:#16272E; --surface-3:#1B2F37;
    --ink:#DFEBEE; --ink-2:#93A9B1; --ink-3:#6B838C;
    --line:#22363E; --line-2:#2E454E;
    --accent:#3FB8C2; --accent-ink:#06232A; --accent-soft:#0F2E33;
    --danger:#E8837F; --danger-soft:#33191A;
    --warn:#D9962F; --ok:#3E9B6F;
    --raia-1:#8FA3AC; --raia-2:#D9962F; --raia-3:#A084D1; --raia-4:#3E9B6F; --raia-5:#3FB8C2;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.30);
    --shadow-lg:0 2px 8px rgba(0,0,0,.40), 0 24px 64px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#0A1317; --surface:#101E24; --surface-2:#16272E; --surface-3:#1B2F37;
  --ink:#DFEBEE; --ink-2:#93A9B1; --ink-3:#6B838C;
  --line:#22363E; --line-2:#2E454E;
  --accent:#3FB8C2; --accent-ink:#06232A; --accent-soft:#0F2E33;
  --danger:#E8837F; --danger-soft:#33191A;
  --warn:#D9962F; --ok:#3E9B6F;
  --raia-1:#8FA3AC; --raia-2:#D9962F; --raia-3:#A084D1; --raia-4:#3E9B6F; --raia-5:#3FB8C2;
  --shadow:0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.30);
  --shadow-lg:0 2px 8px rgba(0,0,0,.40), 0 24px 64px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3);
}

/* ---------- barra superior ---------- */
.topo{
  flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; flex-direction:column;
}
.topo-l1{display:flex; align-items:center; gap:12px 18px; padding:10px 18px 8px; flex-wrap:wrap}
.marca{display:flex; flex-direction:column; gap:1px; min-width:0}
.marca h1{margin:0; font-size:15px; font-weight:650; letter-spacing:-.012em; white-space:nowrap}
.marca .sub{font-size:11px; color:var(--ink-3)}
.marca .sub b{color:var(--ink-2); font-weight:600}

.aviso{
  display:flex; align-items:center; gap:7px; margin-left:auto; flex:0 1 auto; min-width:0;
  background:var(--danger-soft); color:var(--danger);
  border:1px solid color-mix(in srgb, var(--danger) 28%, transparent);
  border-radius:5px; padding:4px 10px; font-size:11.5px; font-weight:600; white-space:nowrap;
}
.aviso svg{flex:0 0 auto}

.acoes{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.btn{
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:5px;
  padding:5px 11px; font-size:12.5px; font-weight:550; color:var(--ink); white-space:nowrap;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--surface-3); border-color:var(--ink-3)}
.btn.primario{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primario:hover{filter:brightness(1.08)}
.btn.icone{padding:5px 8px; line-height:1}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn .n{font-family:var(--mono); font-size:11px; opacity:.75; margin-left:4px}

.topo-l2{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:0 18px 10px; border-top:1px solid transparent;
}
.busca{position:relative; flex:0 1 300px; min-width:190px}
.busca input{
  width:100%; background:var(--surface-2); border:1px solid var(--line-2); border-radius:5px;
  padding:5px 10px 5px 29px; font-size:12.5px; font-family:var(--mono);
}
.busca input::placeholder{font-family:var(--sans); color:var(--ink-3)}
.busca svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.busca kbd{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:10px; color:var(--ink-3);
  border:1px solid var(--line-2); border-radius:3px; padding:0 4px; background:var(--surface);
}
.filtro{display:flex; align-items:center; gap:5px}
.filtro label{font-size:11px; color:var(--ink-3); font-weight:550}
.filtro select{
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:5px;
  padding:4px 7px; font-size:12px;
}
.limpar{background:none; border:none; color:var(--accent); font-size:11.5px; font-weight:600; padding:4px}

/* ---------- faixa de bloqueados ---------- */
.bloqueados{
  flex:0 0 auto; background:var(--surface-2); border-bottom:1px solid var(--line);
  padding:8px 18px;
}
.bloqueados summary{
  cursor:pointer; display:flex; align-items:center; gap:8px; list-style:none;
  font-size:11.5px; color:var(--ink-2);
}
.bloqueados summary::-webkit-details-marker{display:none}
.bloqueados summary .tag{
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.06em;
  background:var(--danger-soft); color:var(--danger); border-radius:3px; padding:2px 6px;
}
.bloq-lista{display:flex; flex-wrap:wrap; gap:10px; margin-top:9px}
.bloq-item{
  background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--danger); border-radius:5px;
  padding:8px 12px; max-width:520px;
}
.bloq-item .cab{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.bloq-item .kw{font-weight:600; font-size:13px}
.bloq-item p{margin:5px 0 0; font-size:11.5px; color:var(--ink-2); line-height:1.45}

/* ---------- quadro ---------- */
.quadro{flex:1 1 auto; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; background:var(--line); min-height:0}
.raia{background:var(--ground); display:flex; flex-direction:column; min-height:0; min-width:0}
.raia.alvo{background:var(--accent-soft)}
.raia-cab{
  flex:0 0 auto; padding:9px 12px 8px; background:var(--surface);
  border-bottom:1px solid var(--line); border-top:2px solid var(--cor);
  display:flex; align-items:center; gap:8px;
}
.raia-cab .num{
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--cor);
  border:1px solid var(--cor); border-radius:3px; width:16px; height:16px;
  display:grid; place-items:center; flex:0 0 auto;
}
.raia-cab h2{margin:0; font-size:12.5px; font-weight:640; letter-spacing:-.005em; flex:1 1 auto}
.raia-cab .conta{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink-2)}
.raia-cab .status{display:block; font-size:10px; color:var(--ink-3); font-family:var(--mono)}
.raia-corpo{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:0 8px 24px}

.dia{margin-top:12px}
.dia-cab{
  position:sticky; top:0; z-index:2; background:var(--ground);
  padding:5px 4px 4px; display:flex; align-items:baseline; gap:6px;
  border-bottom:1px solid var(--line-2);
}
.dia-cab .d{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:-.01em}
.dia-cab .ext{font-size:10.5px; color:var(--ink-3); flex:1 1 auto}
.dia-cab .c{font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.cat-cab{
  display:flex; align-items:baseline; gap:6px; padding:9px 4px 4px;
}
.cat-cab .p{width:6px; height:6px; border-radius:2px; background:var(--ink-3); flex:0 0 auto}
.cat-cab .n{font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
.cat-cab .c{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-left:auto}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:6px;
  border-left:3px solid var(--cor); padding:9px 10px; margin-bottom:6px;
  box-shadow:var(--shadow); cursor:grab; transition:border-color .12s, transform .12s;
  display:flex; flex-direction:column; gap:6px;
}
.card:hover{border-color:var(--line-2)}
.card.sel{outline:2px solid var(--accent); outline-offset:1px}
.card.arrastando{opacity:.4}
.card-l1{display:flex; align-items:center; gap:6px}
.card-l1 .id{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--ink-3); letter-spacing:.02em}
.card-l1 .selos{margin-left:auto; display:flex; gap:4px}
.card h3{margin:0; font-size:13px; font-weight:600; line-height:1.3; letter-spacing:-.008em; text-wrap:balance}
.card .slug{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); word-break:break-all}
.card-l3{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding-top:1px}
.metrica{display:flex; align-items:baseline; gap:3px}
.metrica .r{font-size:9.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em}
.metrica .v{font-family:var(--mono); font-size:11.5px; font-weight:650; font-variant-numeric:tabular-nums}
.intencao{font-size:10px; color:var(--ink-2); background:var(--surface-3); border-radius:3px; padding:1px 5px}
.card .url{font-family:var(--mono); font-size:10px; color:var(--accent); word-break:break-all}
.card .nota{font-size:11px; color:var(--ink-2); background:var(--surface-2); border-left:2px solid var(--warn); padding:4px 7px; border-radius:0 4px 4px 0}
.card .nota b{color:var(--ink); font-weight:600}

.selo{
  font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.03em;
  border-radius:3px; padding:1px 5px; white-space:nowrap; border:1px solid transparent;
}
.selo.arq{background:var(--surface-3); color:var(--ink-2)}
.selo.semarq{background:var(--danger-soft); color:var(--danger); border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.selo.hash{background:color-mix(in srgb,var(--warn) 14%,transparent); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.selo.dep{background:color-mix(in srgb,var(--raia-3) 14%,transparent); color:var(--raia-3); border-color:color-mix(in srgb,var(--raia-3) 32%,transparent)}
.selo.edit{background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.selo.canib{background:var(--danger-soft); color:var(--danger); border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.selo.agendado{background:color-mix(in srgb,var(--raia-4) 14%,transparent); color:var(--raia-4); border-color:color-mix(in srgb,var(--raia-4) 32%,transparent)}

.vazio{padding:18px 6px; font-size:11.5px; color:var(--ink-3); text-align:center; line-height:1.5}

/* ---------- gaveta ---------- */
.fundo{
  position:fixed; inset:0; background:rgba(14,32,40,.45); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .16s;
}
.fundo.on{opacity:1; pointer-events:auto}
.gaveta{
  position:fixed; top:0; right:0; bottom:0; width:min(760px,94vw); z-index:41;
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; transform:translateX(101%); transition:transform .18s ease-out;
}
.gaveta.on{transform:none}
.gaveta[hidden]{display:none}
.g-cab{flex:0 0 auto; padding:13px 16px 10px; border-bottom:1px solid var(--line)}
.g-cab .l1{display:flex; align-items:flex-start; gap:12px}
.g-cab h2{margin:2px 0 0; font-size:17px; font-weight:640; letter-spacing:-.018em; line-height:1.25; text-wrap:balance}
.g-cab .fechar{background:none; border:none; color:var(--ink-3); font-size:20px; line-height:1; padding:2px 6px; margin-left:auto}
.g-cab .fechar:hover{color:var(--ink)}
.g-meta{display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:9px}
.g-meta .par{display:flex; align-items:baseline; gap:5px}
.g-meta .par .r{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3)}
.g-meta .par .v{font-family:var(--mono); font-size:11.5px; font-weight:600}

.g-abas{flex:0 0 auto; display:flex; align-items:center; gap:2px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.aba{
  background:none; border:none; border-bottom:2px solid transparent; padding:8px 11px;
  font-size:12.5px; font-weight:600; color:var(--ink-3);
}
.aba[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.aba .p{font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-left:5px}
.g-abas .dir{margin-left:auto; display:flex; gap:3px; padding:4px 0}
.tog{
  background:var(--surface); border:1px solid var(--line-2); border-radius:4px;
  padding:3px 9px; font-size:11.5px; font-weight:600; color:var(--ink-2);
}
.tog[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

.g-medidor{
  flex:0 0 auto; display:flex; gap:16px; flex-wrap:wrap; align-items:center;
  padding:7px 16px; border-bottom:1px solid var(--line); background:var(--surface-2);
}
.med{display:flex; align-items:baseline; gap:5px; font-size:11px}
.med .r{color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; font-size:9.5px}
.med .v{font-family:var(--mono); font-weight:700; font-size:12px}
.med.ruim .v{color:var(--danger)}
.med .lim{font-family:var(--mono); color:var(--ink-3); font-size:10.5px}
.g-medidor .sujo{margin-left:auto; font-size:11px; font-weight:600; color:var(--warn)}

.g-corpo{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.g-corpo textarea{
  flex:1 1 auto; min-height:0; width:100%; overflow:auto; border:none; resize:none; padding:14px 16px;
  font-family:var(--mono); font-size:12.5px; line-height:1.65; background:var(--surface);
  tab-size:2;
}
.g-corpo textarea:focus{outline:none}
.previa{flex:1 1 auto; min-height:0; overflow:auto; padding:20px 22px; background:var(--surface)}
.g-corpo .estado-vazio{flex:1 1 auto; overflow:auto; padding:44px 24px; text-align:center; color:var(--ink-2); max-width:460px; margin:0 auto}
.g-corpo .estado-vazio .tit{font-size:15px; font-weight:620; color:var(--ink); margin-bottom:7px}
.g-corpo .estado-vazio p{font-size:12.5px; line-height:1.6; margin:0 0 9px}

.g-lado{flex:0 0 auto; border-top:1px solid var(--line); background:var(--surface-2); padding:10px 16px; max-height:31vh; overflow:auto}
.g-lado h3{margin:0 0 7px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.kws{display:flex; flex-direction:column; gap:2px}
.kw-l{display:flex; align-items:baseline; gap:8px; font-size:11.5px; padding:2px 0; border-bottom:1px solid var(--line)}
.kw-l:last-child{border-bottom:none}
.kw-l .k{flex:1 1 auto; font-family:var(--mono); word-break:break-word}
.kw-l .v{font-family:var(--mono); font-size:11px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.kw-l .d{font-family:var(--mono); font-size:10px; color:var(--ink-3); flex:0 0 auto; max-width:44%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.alerta{
  background:var(--danger-soft); border:1px solid color-mix(in srgb,var(--danger) 28%,transparent);
  border-left-width:3px; border-radius:0 5px 5px 0; padding:8px 11px; margin-bottom:9px; font-size:11.5px; line-height:1.5;
}
.alerta b{color:var(--danger)}
.alerta code{font-family:var(--mono); font-size:11px}

.g-rodape{flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:10px 16px; border-top:1px solid var(--line); flex-wrap:wrap}
.g-rodape .mover{display:flex; align-items:center; gap:5px; margin-right:auto; flex-wrap:wrap}
.g-rodape .mover .r{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); margin-right:2px}
.mv{
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:4px;
  padding:4px 9px; font-size:11.5px; font-weight:600; color:var(--ink-2);
  border-left:3px solid var(--cor);
}
.mv:hover{background:var(--surface-3); color:var(--ink)}
.mv[disabled]{opacity:.4}
.mv.atual{background:var(--cor); border-color:var(--cor); color:#fff}

/* ---------- modal ---------- */
.modal{
  position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:20px;
  background:rgba(14,32,40,.5);
}
.modal.on{display:grid}
.modal-cx{
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow-lg); width:min(500px,100%); padding:18px 20px 16px;
}
.modal-cx h2{margin:0 0 5px; font-size:16px; font-weight:640; letter-spacing:-.015em}
.modal-cx .expl{font-size:12.5px; color:var(--ink-2); line-height:1.55; margin:0 0 14px}
.campo{display:flex; flex-direction:column; gap:4px; margin-bottom:12px}
.campo label{font-size:10.5px; font-weight:650; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2)}
.campo input,.campo textarea{
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:5px;
  padding:7px 9px; font-size:13px; font-family:var(--mono);
}
.campo textarea{font-family:var(--sans); min-height:62px; resize:vertical; line-height:1.5}
.campo .dica{font-size:11px; color:var(--ink-3); font-family:var(--mono)}
.campo.erro input,.campo.erro textarea{border-color:var(--danger)}
.campo .msg{font-size:11.5px; color:var(--danger); display:none; line-height:1.45}
.campo.erro .msg{display:block}
.modal-acoes{display:flex; gap:7px; justify-content:flex-end; margin-top:4px}

@media (max-width:1180px){
  .quadro{grid-template-columns:1fr; gap:0}
  .raia{display:none; border-top:none}
  .raia.ativa{display:flex}
  .seletor-raia{display:flex !important}
}
.seletor-raia{display:none; gap:4px; padding:0 18px 10px; flex-wrap:wrap}
.sr{
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:5px;
  padding:5px 10px; font-size:12px; font-weight:600; color:var(--ink-2);
  border-top:2px solid var(--cor);
}
.sr[aria-pressed="true"]{background:var(--surface-3); color:var(--ink)}
.sr .n{font-family:var(--mono); font-size:10.5px; margin-left:5px; color:var(--ink-3)}
</style>

<div class="topo">
  <div class="topo-l1">
    <div class="marca">
      <h1>Painel de Conteúdos</h1>
      <div class="sub">Use Zero Hora &middot; grade de <b id="s-mes">—</b> &middot; hoje <b class="mono" id="s-hoje">—</b></div>
    </div>
    <div class="aviso" title="O painel não escreve no repositório e não publica no blog.">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.4"/><path d="M8 4.8v3.9M8 11.1v.1"/></svg>
      Não publica e não grava no repositório

\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BlogPosting\",\n  \"headline\": \"Blusa com proteção UV: como funciona e como escolher a sua\",\n  \"description\": \"Como funciona a blusa com proteção UV50+, quanto de radiação a trama barra, se a proteção resiste à lavagem e como escolher entre manga longa e manga curta.\",\n  \"inLanguage\": \"pt-BR\",\n  \"datePublished\": \"2026-08-19\",\n  \"dateModified\": \"2026-08-19\",\n  \"mainEntityOfPage\": {\n    \"@type\": \"WebPage\",\n    \"@id\": \"https://usezerohora.com.br/blog/posts/blusa-com-protecao-uv-{HASH}\"\n  },\n  \"author\": {\n    \"@type\": \"Organization\",\n    \"name\": \"Use Zero Hora\",\n    \"url\": \"https://usezerohora.com.br/\"\n  },\n  \"publisher\": {\n    \"@type\": \"Organization\",\n    \"name\": \"Use Zero Hora\",\n    \"description\": \"Marca brasileira de surf e beachwear\",\n    \"url\": \"https://usezerohora.com.br/\"\n  },\n  \"about\": {\n    \"@type\": \"Thing\",\n    \"name\": \"Roupa com proteção solar UV50+\"\n  }\n}\n<\/script>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BreadcrumbList\",\n  \"itemListElement\": [\n    {\n      \"@type\": \"ListItem\",\n      \"position\": 1,\n      \"name\": \"Use Zero Hora\",\n      \"item\": \"https://usezerohora.com.br/\"\n    },\n    {\n      \"@type\": \"ListItem\",\n      \"position\": 2,\n      \"name\": \"Blog\",\n      \"item\": \"https://usezerohora.com.br/blog/\"\n    },\n    {\n      \"@type\": \"ListItem\",\n      \"position\": 3,\n      \"name\": \"Blusa com proteção UV\",\n      \"item\": \"https://usezerohora.com.br/blog/posts/blusa-com-protecao-uv-{HASH}\"\n    }\n  ]\n}\n<\/script>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Blusa com proteção UV substitui o protetor solar?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Na área que a peça cobre, sim. A ficha técnica das lycras Use Zero Hora declara proteção UV50+ permanente, que bloqueia até 98% dos raios UV nocivos, sem reaplicação. As partes descobertas (rosto, pescoço, mãos e pernas) continuam pedindo protetor.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Quanto tempo dura a proteção UV da roupa?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"A ficha técnica das lycras Use Zero Hora descreve a proteção UV50+ como permanente, porque ela vem da trama do tecido e não de um acabamento aplicado por cima. O número de lavagens testadas é dado indisponível na ficha técnica de 2026-08-10. O que encurta a vida da peça é o desgaste do tecido: fio arrebentado ou malha estirada abre passagem para o sol.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Blusa com proteção UV funciona molhada?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Funciona. As três lycras adultas da Use Zero Hora declaram cobertura mantida mesmo molhada na ficha técnica de 2026-08-10. Camiseta de algodão comum faz o contrário: molhada, a malha estica e deixa passar mais sol do que seca.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Qual a diferença entre UV50+ e FPS 50?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"UV50+ classifica tecido e FPS classifica protetor solar. São escalas de produtos diferentes e não se somam nem se comparam de forma direta. A norma técnica usada para medir o UV50+ das peças Use Zero Hora é dado indisponível na ficha técnica de 2026-08-10.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Criança pode usar blusa com proteção UV?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Pode. A Use Zero Hora tem a Camiseta UV Infantil Neon, com proteção UV50+ que bloqueia até 98% dos raios UVA e UVB, nos tamanhos P, M e G e nas cores azul claro, azul turquesa e rosa, por R$ 149,00 em 10/08/2026. A composição do tecido dessa peça é dado indisponível na ficha técnica.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Roupa com proteção solar precisa ser manga longa?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Não. A manga longa cobre mais pele e resolve sessão longa de sol; a manga curta ventila mais e pede protetor nos braços. A Use Zero Hora fabrica as duas: a Pipeline, de manga longa, por R$ 299,99, e a Backdoor, de manga curta, por R$ 299,00, ambas em 88% poliamida e 12% elastano (preços de 10/08/2026).\"\n      }\n    }\n  ]\n}\n<\/script>\n\n<h1>Blusa com proteção UV: como funciona e como escolher a sua</h1>\n\n<p>A blusa com proteção UV é uma peça de tecido tecnológico que barra a\nradiação solar pela própria trama, sem depender de creme. As lycras da Use\nZero Hora, marca brasileira de surf e beachwear, declaram proteção UV50+\npermanente, que bloqueia até 98% dos raios UV nocivos (ficha técnica de\n10/08/2026). Ela serve para qualquer atividade que passe horas debaixo do\nsol, dentro ou fora da água.</p>\n\n<h2>O que é uma blusa com proteção UV</h2>\n\n<p>É uma camiseta feita com fio sintético de malha fechada, construída para\nfiltrar a radiação ultravioleta. As três lycras adultas da Use Zero Hora usam\n88% poliamida e 12% elastano (ficha técnica de 10/08/2026). A poliamida forma\na barreira e o elastano devolve a elasticidade, o que mantém a malha justa ao\ncorpo sem abrir espaço entre os fios.</p>\n\n<h3>O que é tecido com proteção UV</h3>\n\n<p>É o tecido cuja capacidade de barrar radiação vem da construção da malha:\ndensidade dos fios, tipo de fio e espessura. Isso separa esse tecido de uma\ncamiseta comum, que também protege um pouco, mas sem número declarado e sem\nconsistência. A Use Zero Hora declara UV50+ nas quatro peças de lycra da\nlinha. A gramatura em g/m² dessas peças é <strong>dado indisponível</strong>\nna ficha técnica de 10/08/2026, e o time já pediu o número ao fornecedor.</p>\n\n<h2>O que significa UV50+ e quanto de sol a peça barra</h2>\n\n<p>UV50+ é a classificação de proteção ultravioleta do tecido. Nas peças da\nUse Zero Hora, a ficha técnica de 10/08/2026 traduz esse índice em um número\ndireto: a malha bloqueia até 98% dos raios UV nocivos. A Camiseta UV Infantil\nNeon especifica ainda que a barreira cobre UVA e UVB.</p>\n\n<p>A norma técnica usada na medição é <strong>dado indisponível</strong> na\nficha técnica. Sem ela, o número de 98% vale como declaração do fabricante, e\no texto o apresenta nessa condição.</p>\n\n<h2>A proteção sai na lavagem?</h2>\n\n<p>A ficha técnica de 10/08/2026 chama a proteção das lycras Use Zero Hora de\n<strong>UV50+ permanente</strong>. A palavra importa: proteção que nasce da\ntrama acompanha o tecido, ao contrário de acabamento químico borrifado por\ncima, que vai embora com o tempo. Quantas lavagens a peça aguenta é\n<strong>dado indisponível</strong> na ficha.</p>\n\n<p>O que tira a proteção é o desgaste físico. Malha estirada, fio arrebentado\ne furo abrem passagem para o sol. As três lycras adultas declaram costuras\nreforçadas e resistência ao desgaste de cloro e água salgada, o que atrasa\nesse processo.</p>\n\n<h2>A blusa protege molhada?</h2>\n\n<p>Protege. Pipeline, Backdoor e Itamambuca declaram cobertura mantida mesmo\nquando molhadas (ficha técnica de 10/08/2026). É a diferença que decide entre\nlycra e camiseta de algodão numa sessão de mar: o algodão molhado estica,\nabre a malha e passa a deixar mais sol entrar do que quando estava seco.</p>\n\n<p>As três peças também declaram secagem rápida. O tempo de secagem em\nminutos é <strong>dado indisponível</strong> na ficha técnica.</p>\n\n<h2>Manga longa ou manga curta</h2>\n\n<p>A escolha depende de quanto tempo você fica exposto. Manga longa cobre o\nbraço inteiro e resolve sessão de duas horas ou mais sem reaplicar nada.\nManga curta ventila melhor em dia quente e deixa os braços para o protetor.</p>\n\n<!-- IMAGEM: CAMISETA PIPELINE -->\n\n<h3>Manga longa: Pipeline</h3>\n\n<p>A Camiseta Pipeline é a lycra masculina de manga longa da Use Zero Hora,\ncom UV50+ permanente, 88% poliamida e 12% elastano, modelagem anatômica e\ncosturas posicionadas para reduzir atrito com a prancha. Ela pesa 0,24 kg e\ncusta R$ 299,99 (10/08/2026). É a peça para quem passa a sessão inteira na\nágua.</p>\n\n<h3>Manga curta: Backdoor</h3>\n\n<p>A Camiseta Backdoor traz a mesma composição de 88% poliamida e 12%\nelastano e a mesma proteção UV50+, em manga curta, com elasticidade\nmultidirecional. Ela pesa 0,22 kg e custa R$ 299,00 (10/08/2026). Serve para\nbeach tennis, corrida na areia e dia de calor forte.</p>\n\n<h2>Blusa de proteção solar feminina: o que muda na modelagem</h2>\n\n<p>Muda o corte e o punho. A Camiseta Lycra Feminina Itamambuca traz\nmodelagem anatômica feminina com recortes ergonômicos e costuras em\ncontraste, mais punho com abertura para o polegar, que segura a manga no\nlugar durante a remada e cobre o dorso da mão. Composição de 88% poliamida e\n12% elastano, UV50+ permanente, 0,22 kg, R$ 299,00 (10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA LYCRA FEMININA ITAMAMBUCA -->\n\n<p>Quem procura <strong>camisa de proteção solar feminina</strong> para\nesporte encontra nessa peça os dois pontos que a versão masculina não\nresolve: o ajuste no tronco e a manga que não sobe. O guia completo da\n<a href=\"https://usezerohora.com.br/blog/posts/lycra-surf-feminina-bbc79bb33550\">lycra surf\nfeminina</a> da Use Zero Hora abre os modelos e o caimento.</p>\n\n<h2>Camisa com proteção solar masculina</h2>\n\n<p>Pipeline e Backdoor cobrem a linha masculina, uma em cada comprimento de\nmanga. As duas declaram UV50+ permanente, 88% poliamida e 12% elastano, e\ncustam R$ 299,99 e R$ 299,00 (10/08/2026). Quem procura uma camisa de\nproteção solar masculina para surf leva a Pipeline, de manga longa; para\npraia e treino em dia quente, a Backdoor resolve. Veja as duas em\n<a href=\"https://usezerohora.com.br/masculino/lycra-surf/\">lycra surf</a>.</p>\n\n<h2>Roupa com proteção UV além da blusa</h2>\n\n<p>A proteção UV50+ aparece em outras peças da Use Zero Hora, com construção\ndiferente. Duas delas trazem números que a lycra não tem, e servem de\nreferência quando você compara tecidos.</p>\n\n<ul>\n  <li><strong>Maiô Lycra John</strong>: 83% poliamida e 17% elastano, com\n  <strong>300 g/m²</strong> de gramatura e tecnologia blackout, corpo inteiro\n  até os tornozelos, zíper YKK de 42 cm, UV50+ permanente. R$ 399,99\n  (10/08/2026). É a única peça da base com gramatura declarada.</li>\n  <li><strong>Camiseta Neoprene Cabo Frio</strong>: corpo em neoprene\n  Span/Flex de 1,5 mm, com mangas, gola e recortes em poliamida com elastano e\n  UV50+, costura flatlock. R$ 499,99 (10/08/2026). Ela soma proteção térmica à\n  solar, para água fria.</li>\n</ul>\n\n<p>O guia completo do cluster está em\n<a href=\"https://usezerohora.com.br/rash-guard/\">rash guard, camisa uv e blusa\nuv feminina</a>.</p>\n\n<h2>Como escolher a sua</h2>\n\n<p>Três perguntas resolvem a escolha: quanto tempo você fica no sol, se entra\nna água e para quem é a peça. A tabela abaixo cruza as quatro peças de lycra\nda Use Zero Hora com os atributos que a ficha técnica de 10/08/2026\nsustenta.</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>Peça</th>\n      <th>Manga</th>\n      <th>Composição</th>\n      <th>Proteção</th>\n      <th>Preço (10/08/2026)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Camiseta Pipeline (masculina)</td>\n      <td>Longa</td>\n      <td>88% poliamida / 12% elastano</td>\n      <td>UV50+ permanente, até 98%</td>\n      <td>R$ 299,99</td>\n    </tr>\n    <tr>\n      <td>Camiseta Backdoor (masculina)</td>\n      <td>Curta</td>\n      <td>88% poliamida / 12% elastano</td>\n      <td>UV50+ permanente, até 98%</td>\n      <td>R$ 299,00</td>\n    </tr>\n    <tr>\n      <td>Camiseta Lycra Feminina Itamambuca</td>\n      <td>Longa, com abertura para o polegar</td>\n      <td>88% poliamida / 12% elastano</td>\n      <td>UV50+ permanente, até 98%</td>\n      <td>R$ 299,00</td>\n    </tr>\n    <tr>\n      <td>Camiseta UV Infantil Neon</td>\n      <td>Dado indisponível na ficha técnica</td>\n      <td>Dado indisponível na ficha técnica</td>\n      <td>UV50+, até 98% de UVA e UVB</td>\n      <td>R$ 149,00</td>\n    </tr>\n  </tbody>\n</table>\n\n<!-- IMAGEM: CAMISETA UV INFANTIL NEON -->\n\n<p>A Camiseta UV Infantil Neon sai nos tamanhos P, M e G, nas cores azul\nclaro, azul turquesa e rosa, com logo metalizado no peito.</p>\n\n<p><strong>Escolha sua blusa com proteção UV na\n<a href=\"https://usezerohora.com.br/masculino/lycra-surf/\">lycra masculina</a>\ne na <a href=\"https://usezerohora.com.br/feminino/lycra-surf/\">lycra\nfeminina</a> da Use Zero Hora.</strong></p>\n\n<h2>Perguntas frequentes sobre blusa com proteção UV</h2>\n\n<h3>Blusa com proteção UV substitui o protetor solar?</h3>\n<p>Na área que a peça cobre, sim. A ficha técnica das lycras Use Zero Hora\ndeclara proteção UV50+ permanente, que bloqueia até 98% dos raios UV nocivos,\nsem reaplicação. Rosto, pescoço, mãos e pernas continuam pedindo protetor.</p>\n\n<h3>Quanto tempo dura a proteção UV da roupa?</h3>\n<p>A ficha técnica descreve a proteção UV50+ das lycras Use Zero Hora como\npermanente, porque ela vem da trama do tecido e não de um acabamento aplicado\npor cima. O número de lavagens testadas é dado indisponível na ficha de\n10/08/2026. O que encurta a vida da peça é o desgaste: fio arrebentado ou\nmalha estirada abre passagem para o sol.</p>\n\n<h3>Blusa com proteção UV funciona molhada?</h3>\n<p>Funciona. As três lycras adultas da Use Zero Hora declaram cobertura\nmantida mesmo molhadas (ficha técnica de 10/08/2026). Camiseta de algodão faz\no contrário: molhada, a malha estica e deixa passar mais sol do que seca.</p>\n\n<h3>Qual a diferença entre UV50+ e FPS 50?</h3>\n<p>UV50+ classifica tecido e FPS classifica protetor solar. São escalas de\nprodutos diferentes e não se somam. A norma técnica usada para medir o UV50+\ndas peças Use Zero Hora é dado indisponível na ficha de 10/08/2026.</p>\n\n<h3>Criança pode usar blusa com proteção UV?</h3>\n<p>Pode. A Use Zero Hora fabrica a Camiseta UV Infantil Neon, com UV50+ que\nbloqueia até 98% dos raios UVA e UVB, nos tamanhos P, M e G e nas cores azul\nclaro, azul turquesa e rosa, por R$ 149,00 (10/08/2026). A composição do\ntecido dessa peça é dado indisponível na ficha técnica.</p>\n\n<h3>Roupa com proteção solar precisa ser manga longa?</h3>\n<p>Não. A manga longa cobre mais pele e resolve sessão longa de sol; a manga\ncurta ventila mais e pede protetor nos braços. A Use Zero Hora fabrica as\nduas: Pipeline, de manga longa, por R$ 299,99, e Backdoor, de manga curta,\npor R$ 299,00, ambas em 88% poliamida e 12% elastano (10/08/2026).</p>\n", "editor": "<!--\n  VERSAO EDITOR DE BLOG: sem script/schema, sem breadcrumb, sem h1.\n  Titulo do post (campo do CMS): Blusa com proteção UV: como funciona e como escolher a sua\n  Title SEO: Blusa com Proteção UV: Como Funciona e Como Escolher\n  Meta description: Blusa com proteção UV50+ bloqueia até 98% dos raios solares. Veja como a trama protege, se a proteção sai na lavagem e qual modelo escolher.\n\n  ================== ATENCAO: {HASH} PRECISA SER SUBSTITUIDO ==================\n  O blog da Nuvemshop monta a URL do post como\n    https://usezerohora.com.br/blog/posts/<slug>-<hash>\n  e gera o <hash> so na hora de publicar. Exemplo real de 2026-08-11:\n    https://usezerohora.com.br/blog/posts/lycra-surf-feminina-bbc79bb33550\n\n  URL prevista deste post: https://usezerohora.com.br/blog/posts/blusa-com-protecao-uv-{HASH}\n\n  Passos obrigatorios em E5:\n  1. Crie o post e confirme que o slug ficou \"blusa-com-protecao-uv\".\n  2. Copie a URL final que o CMS gerou, com o hash.\n  3. Troque {HASH} por esse hash aqui, no arquivo blusa-com-protecao-uv.html (canonical,\n     og:url, BlogPosting @id e BreadcrumbList) e na coluna url_dona de\n     producao/registro/kw-donos.csv.\n  4. Registre a URL final em url_final na grade do mes.\n\n  Canonical apontando para {HASH} nao substituido quebra a indexacao da\n  pagina. Nao publique com o placeholder.\n\n  Nao depende de nenhum outro post do lote. Pode ser o primeiro a subir.\n  ==============================================================================\n\n  Schema BlogPosting/BreadcrumbList/FAQPage: adicionar via campo de dados\n  estruturados do CMS, com o JSON do arquivo blusa-com-protecao-uv.html, ja com o hash.\n  Imagens: midia-produtos vazio em 2026-08-12. Pontos de insercao seguem\n  marcados como comentario.\n-->\n<p>A blusa com proteção UV é uma peça de tecido tecnológico que barra a\nradiação solar pela própria trama, sem depender de creme. As lycras da Use\nZero Hora, marca brasileira de surf e beachwear, declaram proteção UV50+\npermanente, que bloqueia até 98% dos raios UV nocivos (ficha técnica de\n10/08/2026). Ela serve para qualquer atividade que passe horas debaixo do\nsol, dentro ou fora da água.</p>\n\n<h2>O que é uma blusa com proteção UV</h2>\n\n<p>É uma camiseta feita com fio sintético de malha fechada, construída para\nfiltrar a radiação ultravioleta. As três lycras adultas da Use Zero Hora usam\n88% poliamida e 12% elastano (ficha técnica de 10/08/2026). A poliamida forma\na barreira e o elastano devolve a elasticidade, o que mantém a malha justa ao\ncorpo sem abrir espaço entre os fios.</p>\n\n<h3>O que é tecido com proteção UV</h3>\n\n<p>É o tecido cuja capacidade de barrar radiação vem da construção da malha:\ndensidade dos fios, tipo de fio e espessura. Isso separa esse tecido de uma\ncamiseta comum, que também protege um pouco, mas sem número declarado e sem\nconsistência. A Use Zero Hora declara UV50+ nas quatro peças de lycra da\nlinha. A gramatura em g/m² dessas peças é <strong>dado indisponível</strong>\nna ficha técnica de 10/08/2026, e o time já pediu o número ao fornecedor.</p>\n\n<h2>O que significa UV50+ e quanto de sol a peça barra</h2>\n\n<p>UV50+ é a classificação de proteção ultravioleta do tecido. Nas peças da\nUse Zero Hora, a ficha técnica de 10/08/2026 traduz esse índice em um número\ndireto: a malha bloqueia até 98% dos raios UV nocivos. A Camiseta UV Infantil\nNeon especifica ainda que a barreira cobre UVA e UVB.</p>\n\n<p>A norma técnica usada na medição é <strong>dado indisponível</strong> na\nficha técnica. Sem ela, o número de 98% vale como declaração do fabricante, e\no texto o apresenta nessa condição.</p>\n\n<h2>A proteção sai na lavagem?</h2>\n\n<p>A ficha técnica de 10/08/2026 chama a proteção das lycras Use Zero Hora de\n<strong>UV50+ permanente</strong>. A palavra importa: proteção que nasce da\ntrama acompanha o tecido, ao contrário de acabamento químico borrifado por\ncima, que vai embora com o tempo. Quantas lavagens a peça aguenta é\n<strong>dado indisponível</strong> na ficha.</p>\n\n<p>O que tira a proteção é o desgaste físico. Malha estirada, fio arrebentado\ne furo abrem passagem para o sol. As três lycras adultas declaram costuras\nreforçadas e resistência ao desgaste de cloro e água salgada, o que atrasa\nesse processo.</p>\n\n<h2>A blusa protege molhada?</h2>\n\n<p>Protege. Pipeline, Backdoor e Itamambuca declaram cobertura mantida mesmo\nquando molhadas (ficha técnica de 10/08/2026). É a diferença que decide entre\nlycra e camiseta de algodão numa sessão de mar: o algodão molhado estica,\nabre a malha e passa a deixar mais sol entrar do que quando estava seco.</p>\n\n<p>As três peças também declaram secagem rápida. O tempo de secagem em\nminutos é <strong>dado indisponível</strong> na ficha técnica.</p>\n\n<h2>Manga longa ou manga curta</h2>\n\n<p>A escolha depende de quanto tempo você fica exposto. Manga longa cobre o\nbraço inteiro e resolve sessão de duas horas ou mais sem reaplicar nada.\nManga curta ventila melhor em dia quente e deixa os braços para o protetor.</p>\n\n<!-- IMAGEM: CAMISETA PIPELINE -->\n\n<h3>Manga longa: Pipeline</h3>\n\n<p>A Camiseta Pipeline é a lycra masculina de manga longa da Use Zero Hora,\ncom UV50+ permanente, 88% poliamida e 12% elastano, modelagem anatômica e\ncosturas posicionadas para reduzir atrito com a prancha. Ela pesa 0,24 kg e\ncusta R$ 299,99 (10/08/2026). É a peça para quem passa a sessão inteira na\nágua.</p>\n\n<h3>Manga curta: Backdoor</h3>\n\n<p>A Camiseta Backdoor traz a mesma composição de 88% poliamida e 12%\nelastano e a mesma proteção UV50+, em manga curta, com elasticidade\nmultidirecional. Ela pesa 0,22 kg e custa R$ 299,00 (10/08/2026). Serve para\nbeach tennis, corrida na areia e dia de calor forte.</p>\n\n<h2>Blusa de proteção solar feminina: o que muda na modelagem</h2>\n\n<p>Muda o corte e o punho. A Camiseta Lycra Feminina Itamambuca traz\nmodelagem anatômica feminina com recortes ergonômicos e costuras em\ncontraste, mais punho com abertura para o polegar, que segura a manga no\nlugar durante a remada e cobre o dorso da mão. Composição de 88% poliamida e\n12% elastano, UV50+ permanente, 0,22 kg, R$ 299,00 (10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA LYCRA FEMININA ITAMAMBUCA -->\n\n<p>Quem procura <strong>camisa de proteção solar feminina</strong> para\nesporte encontra nessa peça os dois pontos que a versão masculina não\nresolve: o ajuste no tronco e a manga que não sobe. O guia completo da\n<a href=\"https://usezerohora.com.br/blog/posts/lycra-surf-feminina-bbc79bb33550\">lycra surf\nfeminina</a> da Use Zero Hora abre os modelos e o caimento.</p>\n\n<h2>Camisa com proteção solar masculina</h2>\n\n<p>Pipeline e Backdoor cobrem a linha masculina, uma em cada comprimento de\nmanga. As duas declaram UV50+ permanente, 88% poliamida e 12% elastano, e\ncustam R$ 299,99 e R$ 299,00 (10/08/2026). Quem procura uma camisa de\nproteção solar masculina para surf leva a Pipe de praia feminina escolher?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"A lycra veste justa por projeto, porque malha folgada abre espaço entre os fios e perde parte da barreira contra o sol. A grade de tamanhos da Camiseta Lycra Feminina Itamambuca é dado indisponível na ficha técnica de 10/08/2026. Consulte a tabela de medidas na página do produto antes de fechar o pedido.\"\n      }\n    }\n  ]\n}\n<\/script>\n\n<h1>Camisa de praia feminina: como escolher a sua</h1>\n\n<p>A camisa de praia feminina é a peça de cima que cobre o tronco e os braços\ndo sol, com tecido que seca rápido e aguenta água salgada. A escolha se\nresolve em três pontos: comprimento da manga, tipo de tecido e modelagem. A\nUse Zero Hora, marca brasileira de surf e beachwear, fabrica a versão técnica\ndessa peça em lycra com proteção UV50+ permanente.</p>\n\n<h2>O que é uma camisa de praia feminina</h2>\n\n<p>É qualquer peça de cima feita para ficar no sol e na água, e não para\nsair depois do banho. O que separa a versão técnica é o tecido: fio sintético\nde malha fechada, que barra radiação, seca rápido e resiste ao cloro e ao\nsal. A Camiseta Lycra Feminina Itamambuca da Use Zero Hora usa 88% poliamida\ne 12% elastano, com UV50+ permanente que bloqueia até 98% dos raios solares\nnocivos (ficha técnica de 10/08/2026).</p>\n\n<h2>Manga longa ou manga curta na praia</h2>\n\n<p>A manga longa cobre o braço inteiro e resolve a sessão de duas horas ou\nmais sem passar creme de novo. A manga curta ventila mais e serve para quem\nfica pouco tempo exposto. Quem rema, surfa ou joga beach tennis ganha mais\ncom a manga longa, porque ela também protege do atrito.</p>\n\n<!-- IMAGEM: CAMISETA LYCRA FEMININA ITAMAMBUCA -->\n\n<h3>Camisa manga longa praia: o que olhar</h3>\n\n<p>Três detalhes mudam o uso: o punho, a costura e o peso. A Itamambuca traz\npunho com abertura para o polegar, que segura a manga no lugar durante a\nremada e cobre o dorso da mão. As costuras são anatômicas e ficam em\ncontraste com o corpo da peça. Ela pesa 0,22 kg (ficha técnica de\n10/08/2026).</p>\n\n<h3>Camiseta UV feminina manga longa para o dia inteiro</h3>\n\n<p>Para dia cheio de sol, a camiseta UV feminina manga longa entrega a maior\nárea coberta entre as peças de cima. A Itamambuca declara tecido leve,\nrespirável e de secagem rápida, e mantém a cobertura mesmo molhada. A\ngramatura em g/m² dessa peça é <strong>dado indisponível</strong> na ficha\ntécnica de 10/08/2026.</p>\n\n<h2>Camiseta de praia feminina para surf e esporte</h2>\n\n<p>No esporte, a peça precisa ficar no lugar. Modelagem folgada sobe na\nremada, junta tecido no ombro e deixa a pele exposta bem na hora em que você\nestá de bruços na prancha. A Itamambuca usa modelagem anatômica feminina com\nrecortes ergonômicos, feita para acompanhar o movimento sem sobrar.</p>\n\n<p>Quem procura <strong>camisetas femininas surf</strong> encontra o guia\ncompleto em <a href=\"https://usezerohora.com.br/blog/posts/lycra-surf-feminina-bbc79bb33550\">lycra surf\nfeminina</a>. A mesma peça atende quem busca\n<strong>camiseta surf feminina</strong> para beach tennis, stand up paddle,\ncorrida e caminhada, segundo a indicação de uso da ficha técnica.</p>\n\n<h2>Camisa térmica para praia: quando faz sentido</h2>\n\n<p>A camisa térmica resolve água fria, e usa outro material. A Use Zero Hora\nfabrica a Camiseta Neoprene Cabo Frio, com corpo em neoprene Span/Flex de\n1,5 mm para isolamento térmico, mangas e gola em poliamida com elastano e\nUV50+, e costura flatlock, por R$ 499,99 (10/08/2026). Ela sai em modelagem\nmasculina.</p>\n\n<p>Versão feminina de camisa térmica é <strong>dado indisponível</strong> na\nficha técnica de 10/08/2026. Quem procura <strong>camisa termica praia</strong>\nou <strong>camisa termica para praia</strong> em modelagem feminina encontra\nhoje a cobertura térmica nos maiôs body de manga longa, que a seção abaixo\ndescreve.</p>\n\n<h2>Camiseta lycra feminina: o que o teci    }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Camiseta UV50 e camiseta UV50+ são a mesma coisa?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"As duas grafias apontam para a mesma faixa de proteção, e o sinal de mais indica que o tecido fica no topo da escala. As peças da Use Zero Hora declaram UV50+ permanente, que bloqueia até 98% dos raios UV nocivos, na ficha técnica de 10/08/2026. A norma técnica usada na medição é dado indisponível na ficha.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Camisa de lycra e camiseta de lycra são a mesma peça?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"No uso brasileiro, sim: os dois nomes descrevem a peça de cima em malha sintética com proteção solar. A Use Zero Hora chama suas peças de camiseta de lycra, e todas usam 88% poliamida e 12% elastano na linha adulta (ficha técnica de 10/08/2026).\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Como lavar camiseta com proteção UV?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"A ficha técnica da Use Zero Hora traz instruções de lavagem só para a Camiseta Neoprene Cabo Frio: lavar à mão em água fria, sem alvejante, secar à sombra, sem secadora, sem passar e sem guardar úmida. Para as camisetas de lycra, as instruções são dado indisponível na ficha de 10/08/2026. Consulte a etiqueta da peça.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Camiseta com proteção UV serve para pescar?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Serve. A ficha técnica indica a Camiseta Pipeline e a Camiseta Backdoor para pesca esportiva, junto de surf, natação, stand up paddle e corrida. Para pesca, a manga longa da Pipeline cobre mais braço nas horas paradas sob o sol.\"\n      }\n    }\n  ]\n}\n<\/script>\n\n<h1>Camiseta com proteção UV: qual escolher para cada uso</h1>\n\n<p>A camiseta com proteção UV é a peça de lycra que barra a radiação solar\npela trama do tecido, sem creme. As da Use Zero Hora, marca brasileira de surf\ne beachwear, declaram UV50+ permanente que bloqueia até 98% dos raios UV\nnocivos (ficha técnica de 10/08/2026). O que muda entre um modelo e outro é o\nuso: surf, piscina, praia ou dia a dia.</p>\n\n<h2>O que é uma camiseta com proteção UV</h2>\n\n<p>É uma camiseta de fio sintético com malha fechada, construída para filtrar\nradiação ultravioleta. A linha adulta da Use Zero Hora usa 88% poliamida e 12%\nelastano (ficha técnica de 10/08/2026). Para entender como a barreira funciona,\nse ela sai na lavagem e se protege molhada, o guia completo está em\n<a href=\"https://usezerohora.com.br/blog/posts/blusa-com-protecao-uv-{HASH}\">blusa com\nproteção UV</a>. Esta página trata de qual peça usar em cada atividade.</p>\n\n<h2>Camiseta proteção solar para surf</h2>\n\n<p>No surf, a camiseta enfrenta duas coisas ao mesmo tempo: sol por horas e\natrito com a prancha. A Camiseta Pipeline resolve as duas, com UV50+\npermanente, manga longa, costuras anatômicas posicionadas para reduzir atrito\ne compressão leve para o tecido não sobrar na remada. Ela usa 88% poliamida e\n12% elastano, pesa 0,24 kg e custa R$ 299,99 (10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA PIPELINE -->\n\n<p>A ficha técnica indica a peça para surf, bodyboard, stand up paddle,\nkitesurf, windsurf, jet ski, pesca, mergulho recreativo, corrida e trilhas.\nVeja <a href=\"https://usezerohora.com.br/masculino/lycra-surf/\">lycra surf e\ncamiseta surf masculina</a> da Use Zero Hora.</p>\n\n<h2>Camiseta para piscina: o que o cloro faz</h2>\n\n<p>O cloro ataca o elastano, que é o fio responsável pela elasticidade da\nmalha. Quando o elastano cede, a peça folga, abre espaço entre os fios e perde\nparte da barreira contra o sol. As três lycras adultas da Use Zero Hora\ndeclaram resistência ao desgaste causado por cloro e água salgada (ficha\ntécnica de 10/08/2026), e a Pipeline traz natação entre as indicações de\nuso.</p>\n\n<p>Enxaguar a peça em água doce logo depois do banho tira o cloro antes que\nele trabalhe no tecido. O Maiô Lycra John, de 300 g/m², declara alta\nresistência a cloro e água salgada e é a peça da base com a malha mais densa,\npor R$ 399,99 (10/08/2026).</p>\n\n<h2>Camiseta de praia masculina para o dia a dia</h2>\n\n<p>Para praia, quiosque e treino em dia quente, a manga curta ventila mais e\npesa menos. A Camiseta Backdoor traz a mesma proteção UV50+ permanente e a\nmesma composição de 88% poliamida e 12% elastano da Pipeline, com\nelasticidade multidirecional e alta respirabilidade. Ela pesa 0,22 kg e custa\nR$ 299,00 (10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA BACKDOOR -->\n\n<p>A ficha indica a peça para surf, natação, stand up paddle, beach tennis,\ncorrida, caminhada, pesca esportiva e trilha.</p>\n\n<h2>Camiseta UV 50 masculina: qual manga para qual uso</h2>\n\n<p>A conta é simples: quanto mais tempo exposto, mais manga. Sessão de duas\nhoras ou mais no mar pede a manga longa da Pipeline, que cobre o braço\ninteiro. Dia curto de praia ou treino na areia funciona com a manga curta da\nBackdoor, com protetor nos braços.</p>\n\n<p>Quem procura <strong>camiseta uv 50 masculina</strong> ou\n<strong>camiseta uv50</strong> encontra as duas grafias apontando para a mesma\nfaixa de proteção. Os modelos masculino, feminino e infantil estão em\n<a href=\"https://usezerohora.com.br/rash-guard/\">rash guard, camiseta uv e\ncamisa uv</a>.</p>\n\n<h2>Camisa de lycra ou camiseta de lycra: o que muda no nome</h2>\n\n<p>Nada muda na peça. No uso brasileiro, <strong>camisa de lycra</strong> e\n<strong>camiseta de lycra</strong> descrevem o mesmo item: a peça de cima em\nmalha sintética, ajustada ao corpo, com proteção solar declarada. A Use Zero\nHora chama as suas de camiseta, e a linha adulta inteira usa 88% poliamida e\n12% elastano (ficha técnica de 10/08/2026).</p>\n\n<p>O nome que muda a peça de verdade é o material. Neoprene é outra\nconstrução: a Camiseta Neoprene Cabo Frio traz corpo em neoprene Span/Flex de\n1,5 mm com mangas e gola em poliamida com elastano e UV50+, por R$ 499,99\n(10/08/2026), e serve para água fria.</p>\n\n<h2>Como lavar e guardar</h2>\n\n<p>A ficha técnica de 10/08/2026 traz instruções de cuidado para uma única\npeça, a Camiseta Neoprene Cabo Frio: lavar à mão em água fria depois do uso,\nsem alvejante, secar à sombra, sem secadora, sem passar e sem guardar úmida.</p>\n\n<p>Para as camisetas de lycra, as instruções de lavagem são <strong>dado\nindisponível</strong> na ficha técnica, e o time já pediu o texto ao\nfornecedor. Até lá, siga a etiqueta da peça.</p>\n\n<h2>Como escolher: qual camiseta para qual atividade</h2>\n\n<p>Escolha pela atividade que você faz mais, não pela que faz uma vez por ano.\nA tabela cruza as duas camisetas adultas com os usos que a ficha técnica de\n10/08/2026 indica para cada uma.</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>Atividade</th>\n      <th>Peça indicada</th>\n      <th>Por quê</th>\n      <th>Preço (10/08/2026)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Surf, bodyboard, SUP, kitesurf</td>\n      <td>Camiseta Pipeline</td>\n      <td>Manga longa e costuras contra atrito com a prancha</td>\n      <td>R$ 299,99</td>\n    </tr>\n    <tr>\n      <td>Natação e piscina</td>\n      <td>Camiseta Pipeline</td>\n      <td>Resistência a cloro e indicação de natação na ficha</td>\n      <td>R$ 299,99</td>\n    </tr>\n    <tr>\n      <td>Beach tennis, corrida, praia</td>\n      <td>Camiseta Backdoor</td>\n      <td>Manga curta, alta respirabilidade, 0,22 kg</td>\n      <td>R$ 299,00</td>\n    </tr>\n    <tr>\n      <td>Pesca esportiva</td>\n      <td>Camiseta Pipeline</td>\n      <td>Manga longa para horas paradas sob o sol</td>\n      <td>R$ 299,99</td>\n    </tr>\n    <tr>\n      <td>Água fria</td>\n      <td>Camiseta Neoprene Cabo Frio</td>\n      <td>Neoprene de 1,5 mm com isolamento térmico</td>\n      <td>R$ 499,99</td>\n    </tr>\n  </tbody>\n</table>\n\n<p>A gramatura em g/m² das camisetas de lycra é <strong>dado\nindisponível</strong> na ficha técnica de 10/08/2026.</p>\n\n<p><strong>Escolha sua camiseta com proteção UV na\n<a href=\"https://usezerohora.com.br/masculino/lycra-surf/\">lycra da Use Zero\nHora</a>.</strong></p>\n\n<h2>Perguntas frequentes sobre camiseta com proteção UV</h2>\n\n<h3>Camiseta com proteção UV pode entrar na piscina?</h3>\n<p>Pode. A ficha técnica das lycras Use Zero Hora declara resistência ao\ndesgaste causado por cloro e água salgada, e a Camiseta Pipeline indica uso em\nnatação. O cloro ataca o elastano com o tempo, então enxaguar a peça em água\ndoce logo depois do banho estende a vida dela.</p>\n\n<h3>Qual camiseta com proteção UV usar para surfar?</h3>\n<p>Para surf, a manga longa cobre o braço na remada e reduz o atrito com a\nprancha. A Camiseta Pipeline da Use Zero Hora traz UV50+ permanente, 88%\npoliamida e 12% elastano, costuras anatômicas posicionadas para reduzir atrito\ne compressão leve, por R$ 299,99 (10/08/2026).</p>\n\n<h3>Camiseta UV50 e camiseta UV50+ são a mesma coisa?</h3>\n<p>As duas grafias apontam para a mesma faixa de proteção, e o sinal de mais\nindica que o tecido fica no topo da escala. As peças da Use Zero Hora declaram\nUV50+ permanente, que bloqueia até 98% dos raios UV nocivos, na ficha técnica\nde 10/08/2026. A norma técnica usada na medição é dado indisponível na\nficha.</p>\n\n<h3>Camisa de lycra e camiseta de lycra são a mesma peça?</h3>\n<p>No uso brasileiro, sim: os dois nomes descrevem a peça de cima em malha\nsintética com proteção solar. A Use Zero Hora chama suas peças de camiseta de\nlycra, e todas usam 88% poliamida e 12% elastano na linha adulta (ficha\ntécnica de 10/08/2026).</p>\n\n<h3>Como lavar camiseta com proteção UV?</h3>\n<p>A ficha técnica da Use Zero Hora traz instruções de lavagem só para a\nCamiseta Neoprene Cabo Frio: lavar à mão em água fria, sem alvejante, secar à\nsombra, sem secadora, sem passar e sem guardar úmida. Para as camisetas de\nlycra, as instruções são dado indisponível na ficha de 10/08/2026. Consulte a\netiqueta da peça.</p>\n\n<h3>Camiseta com proteção UV serve para pescar?</h3>\n<p>Serve. A ficha técnica indica a Camiseta Pipeline e a Camiseta Backdoor\npara pesca esportiva, junto de surf, natação, stand up paddle e corrida. Para\npesca, a manga longa da Pipeline cobre mais braço nas horas paradas sob o\nsol.</p>\n", "editor": "<!--\n  VERSAO EDITOR DE BLOG: sem script/schema, sem breadcrumb, sem h1.\n  Titulo do post (campo do CMS): Camiseta com proteção UV: qual escolher para cada uso\n  Title SEO: Camiseta com Proteção UV: Qual Escolher | Use Zero Hora\n  Meta description: Camiseta com proteção UV para surf, piscina e praia: veja qual modelo serve para cada uso, o que o cloro faz e como cuidar da peça.\n\n  ================== ATENCAO: {HASH} PRECISA SER SUBSTITUIDO ==================\n  O blog da Nuvemshop monta a URL do post como\n    https://usezerohora.com.br/blog/posts/<slug>-<hash>\n  e gera o <hash> so na hora de publicar. Exemplo real de 2026-08-11:\n    https://usezerohora.com.br/blog/posts/lycra-surf-feminina-bbc79bb33550\n\n  URL prevista deste post: https://usezerohora.com.br/blog/posts/camiseta-com-protecao-uv-{HASH}\n\n  Passos obrigatorios em E5:\n  1. Crie o post e confirme que o slug ficou \"camiseta-com-protecao-uv\".\n  2. Copie a URL final que o CMS gerou, com o hash.\n  3. Troque {HASH} por esse hash aqui, no arquivo camiseta-com-protecao-uv.html (canonical,\n     og:url, BlogPosting @id e BreadcrumbList) e na coluna url_dona de\n     producao/registro/kw-donos.csv.\n  4. Registre a URL final em url_final na grade do mes.\n\n  Canonical apontando para {HASH} nao substituido quebra a indexacao da\n  pagina. Nao publique com o placeholder.\n\n  DEPENDE DE OUTRO POST JA PUBLICADO. O corpo tem 1 link(s) para:\n    - blusa-com-protecao-uv\n  Publique esse(s) post(s) primeiro, colha a URL real de cada um e\n  substitua o {HASH} correspondente ANTES de colar este texto.\n  ==============================================================================\n\n  Schema BlogPosting/BreadcrumbList/FAQPage: adicionar via campo de dados\n  estruturados do CMS, com o JSON do arquivo camiseta-com-protecao-uv.html, ja com o hash.\n  Imagens: midia-produtos vazio em 2026-08-12. Pontos de insercao seguem\n  marcados como comentario.\n-->\n<p>A camiseta com proteção UV é a peça de lycra que barra a radiação solar\npela trama do tecido, sem creme. As da Use Zero Hora, marca brasileira de surf\ne beachwear, declaram UV50+ permanente que bloqueia até 98% dos raios UV\nnocivos (ficha técnica de 10/08/2026). O que muda entre um modelo e outro é o\nuso: surf, piscina, praia ou dia a dia.</p>\n\n<h2>O que é uma camiseta com proteção UV</h2>\n\n<p>É uma camiseta de fio sintético com malha fechada, construída para filtrar\nradiação ultravioleta. A linha adulta da Use Zero Hora usa 88% poliamida e 12%\nelastano (ficha técnica de 10/08/2026). Para entender como a barreira funciona,\nse ela sai na lavagem e se protege molhada, o guia completo está em\n<a href=\"https://usezerohora.com.br/blog/posts/blusa-com-protecao-uv-{HASH}\">blusa com\nproteção UV</a>. Esta página trata de qual peça usar em cada atividade.</p>\n\n<h2>Camiseta proteção solar para surf</h2>\n\n<p>No surf, a camiseta enfrenta duas coisas ao mesmo tempo: sol por horas e\natrito com a prancha. A Camiseta Pipeline resolve as duas, com UV50+\npermanente, manga longa, costuras anatômicas posicionadas para reduzir atrito\ne compressão leve para o tecido não sobrar na remada. Ela usa 88% poliamida e\n12% elastano, pesa 0,24 kg e custa R$ 299,99 (10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA PIPELINE -->\n\n<p>A ficha técnica indica a peça para surf, bodyboard, stand up paddle,\nkitesurf, windsurf, jet ski, pesca, mergulho recreativo, corrida e trilhas.\nVeja <a href=\"https://usezerohora.com.br/masculino/lycra-surf/\">lycra surf e\ncamiseta surf masculina</a> da Use Zero Hora.</p>\n\n<h2>Camiseta para piscina: o que o cloro faz</h2>\n\n<p>O cloro ataca o elastano, que é o fio responsável pela elasticidade da\nmalha. Quando o elastano cede, a peça folga, abre espaço entre os fios e perde\nparte da barreira contra o sol. As três lycras adultas da Use Zero Hora\ndeclaram resistência ao desgaste causado por cloro e água salgada (ficha\ntécnica de 10/08/2026), e a Pipeline traz natação entre as indicações de\nuso.</p>\n\n<p>Enxaguar a peça em água doce logo depois do banho tira o cloro antes que\nele trabalhe no tecido. O Maiô Lycra John, de 300 g/m², declara alta\nresistência a cloro e água salgada e é a peça da base com a malha mais densa,\npor R$ 399,99 (10/08/2026).</p>\n\n<h2>Camiseta de praia masculina para o dia a dia</h2>\n\n<p>Para praia, quiosque e treino em dia quente, a manga curta ventila mais e\npesa menos. A Camiseta Backdoor traz a mesma proteção UV50+ permanente e a\nmesma composição de 88% poliamida e 12% elastano da Pipeline, com\nelasticidade multidirecional e alta respirabilidade. Ela pesa 0,22 kg e custa\nR$ 299,00 (10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA BACKDOOR -->\n\n<p>A ficha indica a peça para surf, natação, stand up paddle, beach tennis,\ncorrida, caminhada, pesca esportiva e trilha.</p>\n\n<h2>Camiseta UV 50 masculina: qual manga para qual uso</h2>\n\n<p>A conta é simples: quanto mais tempo exposto, mais manga. Sessão de duas\nhoras ou mais no mar pede a manga longa da Pipeline, que cobre o braço\ninteiro. Dia curto de praia ou treino na areia funciona com a manga curta da\nBackdoor, com protetor nos braços.</p>\n\n<p>Quem procura <strong>camiseta uv 50 masculina</strong> ou\n<strong>camiseta uv50</strong> encontra as duas grafias apontando para a mesma\nfaixa de proteção. Os modelos masculino, feminino e infantil estão em\n<a href=\"https://usezerohora.com.br/rash-guard/\">rash guard, camiseta uv e\ncamisa uv</a>.</p>\n\n<h2>C ol entrar.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Rash guard infantil serve para natação?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Serve para natação recreativa. A ficha técnica do Maiô Cepilho Infantil da Use Zero Hora indica praia, piscina e natação recreativa, por R$ 299,00 em 10/08/2026. Para treino de natação com regra de competição, confira o regulamento do clube, porque a peça de proteção solar segue outra especificação.\"\n      }\n    }\n  ]\n}\n<\/script>\n\n<h1>Rash guard infantil: como escolher o da sua criança</h1>\n\n<p>O rash guard infantil é a camiseta de lycra que protege a criança do sol\npela trama do tecido, sem depender de creme reaplicado. A Camiseta UV Infantil\nNeon da Use Zero Hora, marca brasileira de surf e beachwear, declara UV50+ que\nbloqueia até 98% dos raios UVA e UVB (ficha técnica de 10/08/2026). A escolha\nse resolve em duas perguntas: que tamanho e para qual água.</p>\n\n<h2>Rash guard para que serve</h2>\n\n<p>Rash guard é a camiseta técnica que nasceu no surf para evitar o atrito da\npele com a prancha, e que hoje trabalha mais como barreira contra o sol. Na\nversão infantil, ela resolve o problema que todo pai conhece: protetor solar\nsai com a água e ninguém consegue reaplicar em criança a cada quarenta minutos\ndentro do mar.</p>\n\n<p>A peça cobre tronco e braços com uma barreira que fica no lugar o dia\ninteiro. Para entender como a trama barra a radiação, o guia completo está em\n<a href=\"https://usezerohora.com.br/blog/posts/blusa-com-protecao-uv-{HASH}\">blusa com\nproteção UV</a>.</p>\n\n<h2>Que tamanho escolher</h2>\n\n<p>As duas peças infantis da Use Zero Hora usam grades diferentes, e vale\nconferir qual você está comprando. A Camiseta UV Infantil Neon sai em P, M e\nG. O Maiô Infantil Engana Mamãe usa grade por idade: 5/6, 7/8, 9/10 e 11/12\n(ficha técnica de 10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA UV INFANTIL NEON -->\n\n<p>A lycra veste justa por projeto, porque malha folgada abre espaço entre os\nfios e perde parte da barreira contra o sol. Comprar um número acima para\n\"durar mais\" tira proteção. Consulte a tabela de medidas na página do produto\nantes de fechar o pedido.</p>\n\n<h2>Rash guard infantil para piscina e natação</h2>\n\n<p>Para piscina, o inimigo é o cloro, que ataca o elastano e faz a malha\nfolgar com o tempo. A Camiseta UV Infantil Neon indica praia, piscina e\nesportes ao ar livre na ficha técnica, e o Maiô Infantil Engana Mamãe indica\npraia, piscina e esportes aquáticos. Enxaguar a peça em água doce logo depois\ndo banho tira o cloro antes que ele trabalhe no tecido.</p>\n\n<!-- IMAGEM: MAIO INFANTIL ENGANA MAMAE -->\n\n<p>Quem procura <strong>roupa de natação infantil</strong> ou <strong>roupa\npara natação infantil</strong> encontra no Maiô Cepilho Infantil a indicação\nmais direta: a ficha técnica cita praia, piscina e natação recreativa, por\nR$ 299,00 (10/08/2026). O fator de proteção solar dessa peça é <strong>dado\nindisponível</strong>: a ficha registra \"conforme composição do tecido\" e não\ntraz a composição. O time já foi acionado para fechar esse número.</p>\n\n<h2>Manga longa ou manga curta para criança</h2>\n\n<p>Quanto mais tempo no sol, mais manga. Uma tarde inteira de praia ou de\npiscina pede manga longa, que cobre o braço e dispensa reaplicação de creme\nnessa área. O Maiô Infantil Engana Mamãe é de manga longa, com tecido duplo\nsem transparência e forro em poliéster com elastano, por R$ 149,00\n(10/08/2026).</p>\n\n<p>O comprimento de manga da Camiseta UV Infantil Neon é <strong>dado\nindisponível</strong> na ficha técnica de 10/08/2026. Confira na página do\nproduto antes de escolher, se a manga for o critério.</p>\n\n<h2>A proteção sai na lavagem?</h2>\n\n<p>Não sai, quando a proteção vem da trama. A ficha do Maiô Infantil Engana\nMamãe responde a pergunta com todas as letras: a proteção UV50+ é permanente\nno tecido e não sai com as lavagens. Ela também declara material resistente\nque não desbota e garantia de 30 dias de fábrica.</p>\n\n<p>O número de lavagens testadas é <strong>dado indisponível</strong> na ficha\ntécnica. O que tira proteção na prática é o desgaste: malha estirada e fio\narrebentado abrem passagem para o sol, e criança puxa roupa.</p>\n\n<h2>Camiseta UV para criança: cores e modelo</h2>\n\n<p>A Camiseta UV Infantil Neon sai em três cores lisas, azul claro, azul\nturquesa e rosa, com logo metalizado no peito e modelagem infantil. Ela é de\nlycra leve, com secagem rápida e respirabilidade declaradas, pesa 0,12 kg e\ncusta R$ 149,00 (10/08/2026). A composição do tecido é <strong>dado\nindisponível</strong> na ficha.</p>\n\n<p>Quem busca <strong>lycra uv infantil</strong> ou <strong>lycra infantil\npraia</strong> encontra nessa peça a indicação mais ampla da linha: praia,\nbanho de sol, pesca, corrida, trekking e ciclismo. Veja também\n<a href=\"https://usezerohora.com.br/rash-guard/\">camiseta uv infantil e rash\nguard</a> da Use Zero Hora.</p>\n\n<h2>Para o surf da criança</h2>\n\n<p>No surf, a camiseta faz dois trabalhos: barra o sol e reduz o atrito do\npeito com a prancha, que é de onde vem o nome da peça. Quem procura\n<strong>lycra surf infantil</strong> deve olhar o caimento antes da cor: peça\nfolgada junta tecido no ombro quando a criança fica de bruços remando.</p>\n\n<p>Para secar depois da sessão, a ficha traz o Poncho Resort Premium Infantil,\nem 84% viscose e 16% poliéster, com 65 cm de largura por 93 cm de comprimento,\nbolso canguru frontal e fendas laterais de 12 cm, por R$ 249,00\n(10/08/2026).</p>\n\n<h2>Como escolher: tabela das peças infantis</h2>\n\n<p>Escolha pela água em que a criança passa mais tempo e pela grade de tamanho\nque você consegue conferir. A tabela cruza as três peças infantis com os\natributos que a ficha técnica de 10/08/2026 sustenta.</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>Peça</th>\n      <th>Proteção declarada</th>\n      <th>Tamanhos</th>\n      <th>Indicações da ficha</th>\n      <th>Preço (10/08/2026)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Camiseta UV Infantil Neon</td>\n      <td>UV50+, até 98% de UVA e UVB</td>\n      <td>P, M e G</td>\n      <td>Praia, piscina, pesca, corrida, trekking e ciclismo</td>\n      <td>R$ 149,00</td>\n    </tr>\n    <tr>\n      <td>Maiô Infantil Engana Mamãe</td>\n      <td>UV50+ permanente</td>\n      <td>5/6, 7/8, 9/10 e 11/12</td>\n      <td>Praia, piscina e esportes aquáticos</td>\n      <td>R$ 149,00</td>\n    </tr>\n    <tr>\n      <td>Maiô Cepilho Infantil</td>\n      <td>Dado indisponível na ficha técnica</td>\n      <td>Dado indisponível na ficha técnica</td>\n      <td>Praia, piscina e natação recreativa</td>\n      <td>R$ 299,00</td>\n    </tr>\n  </tbody>\n</table>\n\n<p>A composição do tecido da Camiseta UV Infantil Neon e os percentuais do\nMaiô Infantil Engana Mamãe são <strong>dado indisponível</strong> na ficha\ntécnica de 10/08/2026, que registra apenas \"poliamida com elastano\" para o\nsegundo.</p>\n\n<p><strong>Veja o rash guard infantil na página de\n<a href=\"https://usezerohora.com.br/rash-guard/\">rash guard da Use Zero\nHora</a>.</strong></p>\n\n<h2>Perguntas frequentes sobre rash guard infantil</h2>\n\n<h3>Rash guard infantil serve para piscina?</h3>\n<p>Serve. A ficha técnica da Camiseta UV Infantil Neon indica praia, piscina e\nesportes ao ar livre, e a do Maiô Infantil Engana Mamãe indica praia, piscina\ne esportes aquáticos. Enxaguar a peça em água doce depois do banho de piscina\ntira o cloro antes que ele trabalhe no elastano.</p>\n\n<h3>Que tamanho de rash guard infantil escolher?</h3>\n<p>Depende da peça. A Camiseta UV Infantil Neon sai nos tamanhos P, M e G. O\nMaiô Infantil Engana Mamãe usa grade por idade: 5/6, 7/8, 9/10 e 11/12 (ficha\ntécnica de 10/08/2026). A lycra veste justa por projeto, então consulte a\ntabela de medidas da página do produto em vez de pegar um número acima.</p>\n\n<h3>Rash guard infantil precisa ser manga longa?</h3>\n<p>A manga longa cobre mais braço e resolve dia inteiro de sol sem passar\ncreme de novo. O Maiô Infantil Engana Mamãe da Use Zero Hora é de manga longa,\npor R$ 149,00 (10/08/2026). O comprimento de manga da Camiseta UV Infantil\nNeon é dado indisponível na ficha técnica.</p>\n\n<h3>A proteção UV do rash guard infantil sai na lavagem?</h3>\n<p>Não, quando a proteção vem da trama do tecido. A ficha técnica do Maiô\nInfantil Engana Mamãe responde a pergunta na letra: a proteção UV50+ é\npermanente no tecido e não sai com as lavagens. O número de lavagens testadas\né dado indisponível na ficha de 10/08/2026.</p>\n\n<h3>Qual a diferença entre rash guard infantil e camiseta comum?</h3>\n<p>O rash guard usa malha sintética fechada com proteção UV declarada, seca\nrápido e mantém a cobertura molhado. A Camiseta UV Infantil Neon declara UV50+\nque bloqueia até 98% dos raios UVA e UVB. Camiseta de algodão molhada faz o\ncontrário: a malha estica, abre e passa a deixar mais sol entrar.</p>\n\n<h3>Rash guard infantil serve para natação?</h3>\n<p>Serve para natação recreativa. A ficha técnica do Maiô Cepilho Infantil da\nUse Zero Hora indica praia, piscina e natação recreativa, por R$ 299,00\n(10/08/2026). Para treino de natação com regra de competição, confira o\nregulamento do clube, porque a peça de proteção solar segue outra\nespecificação.</p>\n", "editor": "<!--\n  VERSAO EDITOR DE BLOG: sem script/schema, sem breadcrumb, sem h1.\n  Titulo do post (campo do CMS): Rash guard infantil: como escolher o da sua criança\n  Title SEO: Rash Guard Infantil: Como Escolher | Use Zero Hora\n  Meta description: Rash guard infantil com proteção UV50+: veja que tamanho escolher, o que serve para piscina e praia, e se a proteção sai na lavagem.\n\n  ================== ATENCAO: {HASH} PRECISA SER SUBSTITUIDO ==================\n  O blog da Nuvemshop monta a URL do post como\n    https://usezerohora.com.br/blog/posts/<slug>-<hash>\n  e gera o <hash> so na a e ninguém consegue reaplicar em criança a cada quarenta minutos\ndentro do mar.</p>\n\n<p>A peça cobre tronco e braços com uma barreira que fica no lugar o dia\ninteiro. Para entender como a trama barra a radiação, o guia completo está em\n<a href=\"https://usezerohora.com.br/blog/posts/blusa-com-protecao-uv-{HASH}\">blusa com\nproteção UV</a>.</p>\n\n<h2>Que tamanho escolher</h2>\n\n<p>As duas peças infantis da Use Zero Hora usam grades diferentes, e vale\nconferir qual você está comprando. A Camiseta UV Infantil Neon sai em P, M e\nG. O Maiô Infantil Engana Mamãe usa grade por idade: 5/6, 7/8, 9/10 e 11/12\n(ficha técnica de 10/08/2026).</p>\n\n<!-- IMAGEM: CAMISETA UV INFANTIL NEON -->\n\n<p>A lycra veste justa por projeto, porque malha folgada abre espaço entre os\nfios e perde parte da barreira contra o sol. Comprar um número acima para\n\"durar mais\" tira proteção. Consulte a tabela de medidas na página do produto\nantes de fechar o pedido.</p>\n\n<h2>Rash guard infantil para piscina e natação</h2>\n\n<p>Para piscina, o inimigo é o cloro, que ataca o elastano e faz a malha\nfolgar com o tempo. A Camiseta UV Infantil Neon indica praia, piscina e\nesportes ao ar livre na ficha técnica, e o Maiô Infantil Engana Mamãe indica\npraia, piscina e esportes aquáticos. Enxaguar a peça em água doce logo depois\ndo banho tira o cloro antes que ele trabalhe no tecido.</p>\n\n<!-- IMAGEM: MAIO INFANTIL ENGANA MAMAE -->\n\n<p>Quem procura <strong>roupa de natação infantil</strong> ou <strong>roupa\npara natação infantil</strong> encontra no Maiô Cepilho Infantil a indicação\nmais direta: a ficha técnica cita praia, piscina e natação recreativa, por\nR$ 299,00 (10/08/2026). O fator de proteção solar dessa peça é <strong>dado\nindisponível</strong>: a ficha registra \"conforme composição do tecido\" e não\ntraz a composição. O time já foi acionado para fechar esse número.</p>\n\n<h2>Manga longa ou manga curta para criança</h2>\n\n<p>Quanto mais tempo no sol, mais manga. Uma tarde inteira de praia ou de\npiscina pede manga longa, que cobre o braço e dispensa reaplicação de creme\nnessa área. O Maiô Infantil Engana Mamãe é de manga longa, com tecido duplo\nsem transparência e forro em poliéster com elastano, por R$ 149,00\n(10/08/2026).</p>\n\n<p>O comprimento de manga da Camiseta UV Infantil Neon é <strong>dado\nindisponível</strong> na ficha técnica de 10/08/2026. Confira na página do\nproduto antes de escolher, se a manga for o critério.</p>\n\n<h2>A proteção sai na lavagem?</h2>\n\n<p>Não sai, quando a proteção vem da trama. A ficha do Maiô Infantil Engana\nMamãe responde a pergunta com todas as letras: a proteção UV50+ é permanente\nno tecido e não sai com as lavagens. Ela também declara material resistente\nque não desbota e garantia de 30 dias de fábrica.</p>\n\n<p>O número de lavagens testadas é <strong>dado indisponível</strong> na ficha\ntécnica. O que tira proteção na prática é o desgaste: malha estirada e fio\narrebentado abrem passagem para o sol, e criança puxa roupa.</p>\n\n<h2>Camiseta UV para criança: cores e modelo</h2>\n\n<p>A Camiseta UV Infantil Neon sai em três cores lisas, azul claro, azul\nturquesa e rosa, com logo metalizado no peito e modelagem infantil. Ela é de\nlycra leve, com secagem rápida e respirabilidade declaradas, pesa 0,12 kg e\ncusta R$ 149,00 (10/08/2026). A composição do tecido é <strong>dado\nindisponível</strong> na ficha.</p>\n\n<p>Quem busca <strong>lycra uv infantil</strong> ou <strong>lycra infantil\npraia</strong> encontra nessa peça a indicação mais ampla da linha: praia,\nbanho de sol, pesca, corrida, trekking e ciclismo. Veja também\n<a href=\"https://usezerohora.com.br/rash-guard/\">camiseta uv infantil e rash\nguard</a> da Use Zero Hora.</p>\n\n<h2>Para o surf da criança</h2>\n\n<p>No surf, a camiseta faz dois trabalhos: barra o sol e reduz o atrito do\npeito com a prancha, que é de onde vem o nome da peça. Quem procura\n<strong>lycra surf infantil</strong> deve olhar o caimento antes da cor: peça\nfolgada junta tecido no ombro quando a criança fica de bruços remando.</p>\n\n<p>Para secar depois da sessão, a ficha traz o Poncho Resort Premium Infantil,\nem 84% viscose e 16% poliéster, com 65 cm de largura por 93 cm de comprimento,\nbolso canguru frontal e fendas laterais de 12 cm, por R$ 249,00\n(10/08/2026).</p>\n\n<h2>Como escolher: tabela das peças infantis</h2>\n\n<p>Escolha pela água em que a criança passa mais tempo e pela grade de tamanho\nque você consegue conferir. A tabela cruza as três peças infantis com os\natributos que a ficha técnica de 10/08/2026 sustenta.</p>\n\n<table>\n  <thead>\n    <tr>\n      <th>Peça</th>\n      <th>Proteção declarada</th>\n      <th>Tamanhos</th>\n      <th>Indicações da ficha</th>\n      <th>Preço (10/08/2026)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Camiseta UV Infantil Neon</td>\n      <td>UV50+, até 98% de UVA e UVB</td>\n      <td>P, M e G</td>\n      <td>Praia, piscina, pesca, corrida, trekking e ciclismo</td>\n      <td>R$ 149,00</td>\n    </tr>\n    <tr>\n      <td>Maiô Infantil Engana Mamãe</td>\n      <td>UV50+ permanente</td>\n      <td>5/6, 7/8, 9/10 e 11/12</td>\n      <td>Praia, piscina e esportes aquáticos</td>\n      <td>R$ 149,00</td>\n    </tr>\n    <tr>\n      <td>Maiô Cepilho Infantil</td>\n      <td>Dado indisponível na ficha técnica</td>\n      <td>Dado indisponível na ficha técnica</td>\n      <td>Praia, piscina e natação recreativa</td>\n      <td>R$ 299,00</td>\n    </tr>\n  </tbody>\n</table>\n\n<p>A composição do tecido da Camiseta UV Infantil Neon e os percentuais do\nMaiô Infantil Engana Mamãe são <strong>dado indisponível</strong> na ficha\ntécnica de 10/08/2026, que registra apenas \"poliamida com elastano\" para o\nsegundo.</p>\n\n<p><strong>Veja o rash guard infantil na página de\n<a href=\"https://usezerohora.com.br/rash-guard/\">rash guard da Use Zero\nHora</a>.</strong></p>\n\n<h2>Perguntas frequentes sobre rash guard infantil</h2>\n\n<h3>Rash guard infantil serve para piscina?</h3>\n<p>Serve. A ficha técnica da Camiseta UV Infantil Neon indica praia, piscina e\nesportes ao ar livre, e a do Maiô Infantil Engana Mamãe indica praia, piscina\ne esportes aquáticos. Enxaguar a peça em água doce depois do banho de piscina\ntira o cloro antes que ele trabalhe no elastano.</p>\n\n<h3>Que tamanho de rash guard infantil escolher?</h3>\n<p>Depende da peça. A Camiseta UV Infantil Neon sai nos tamanhos P, M e G. O\nMaiô Infantil Engana Mamãe usa grade por idade: 5/6, 7/8, 9/10 e 11/12 (ficha\ntécnica de 10/08/2026). A lycra veste justa por projeto, então consulte a\ntabela de medidas da página do produto em vez de pegar um número acima.</p>\n\n<h3>Rash guard infantil precisa ser manga longa?</h3>\n<p>A manga longa cobre mais braço e resolve dia inteiro de sol sem passar\ncreme de novo. O Maiô Infantil Engana Mamãe da Use Zero Hora é de manga longa,\npor R$ 149,00 (10/08/2026). O comprimento de manga da Camiseta UV Infantil\nNeon é dado indisponível na ficha técnica.</p>\n\n<h3>A proteção UV do rash guard infantil sai na lavagem?</h3>\n<p>Não, quando a proteção vem da trama do tecido. A ficha técnica do Maiô\nInfantil Engana Mamãe responde a pergunta na letra: a proteção UV50+ é\npermanente no tecido e não sai com as lavagens. O número de lavagens testadas\né dado indisponível na ficha de 10/08/2026.</p>\n\n<h3>Qual a diferença entre rash guard infantil e camiseta comum?</h3>\n<p>O rash guard usa malha sintética fechada com proteção UV declarada, seca\nrápido e mantém a cobertura molhado. A Camiseta UV Infantil Neon declara UV50+\nque bloqueia até 98% dos raios UVA e UVB. Camiseta de algodão molhada faz o\ncontrário: a malha estica, abre e passa a deixar mais sol entrar.</p>\n\n<h3>Rash guard infantil serve para natação?</h3>\n<p>Serve para natação recreativa. A ficha técnica do Maiô Cepilho Infantil da\nUse Zero Hora indica praia, piscina e natação recreativa, por R$ 299,00\n(10/08/2026). Para treino de natação com regra de co
